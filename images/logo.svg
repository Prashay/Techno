<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 54" width="280" height="54" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="iconShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Modern Tech Icon -->
  <g transform="translate(4, 5)" filter="url(#iconShadow)">
    <!-- Icon Backdrop Squircle -->
    <rect x="0" y="0" width="44" height="44" rx="12" fill="url(#iconBg)" stroke="url(#brandGrad)" stroke-width="1.8"/>
    
    <!-- Code Bracket Left < -->
    <path d="M16 16 L10 22 L16 28" stroke="#0284c7" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Code Slash / -->
    <line x1="24" y1="14" x2="20" y2="30" stroke="#f59e0b" stroke-width="2.4" stroke-linecap="round"/>
    
    <!-- Code Bracket Right > -->
    <path d="M28 16 L34 22 L28 28" stroke="#6366f1" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Pulse Node Indicator -->
    <circle cx="37" cy="8" r="3.2" fill="#10b981"/>
    <circle cx="37" cy="8" r="4.5" stroke="#10b981" stroke-width="0.8" opacity="0.4"/>
  </g>

  <!-- Logo Typography -->
  <g transform="translate(58, 10)">
    <!-- Main Title (Deep slate on light mode) -->
    <text x="0" y="21" font-family="'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#0f172a" letter-spacing="0.5">
      TECHNO<tspan fill="url(#amberGrad)" font-weight="800">INTERVIEW</tspan>
    </text>
    
    <!-- Subtitle Badge -->
    <text x="1" y="34" font-family="'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" fill="#64748b" letter-spacing="2.6">
      TECH INTERVIEW GUIDE
    </text>
  </g>
</svg>
