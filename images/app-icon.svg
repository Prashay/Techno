<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="amberDot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="appGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Shadow & Background Squircle -->
  <rect x="28" y="28" width="456" height="456" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6" filter="url(#appGlow)"/>

  <!-- Inner Soft Accent Border -->
  <rect x="36" y="36" width="440" height="440" rx="100" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Pulse Green Node Indicator (Top Right) -->
  <g transform="translate(412, 100)">
    <circle cx="0" cy="0" r="24" fill="#10b981" opacity="0.25"/>
    <circle cx="0" cy="0" r="14" fill="#10b981"/>
    <circle cx="0" cy="0" r="5" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Tech Code Brackets: < / > -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Bracket < (Cyan) -->
    <path d="M 215 155 L 135 225 L 215 295" stroke="#38bdf8" stroke-width="28"/>
    
    <!-- Center Slash / (Amber) -->
    <line x1="285" y1="125" x2="225" y2="325" stroke="#f59e0b" stroke-width="28"/>
    
    <!-- Right Bracket > (Indigo) -->
    <path d="M 295 155 L 375 225 L 295 295" stroke="#818cf8" stroke-width="28"/>
  </g>

  <!-- Typography: TECHNO. -->
  <text x="256" y="420" text-anchor="middle" font-family="'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#f8fafc" letter-spacing="4">
    TECHNO<tspan fill="url(#amberDot)">.</tspan>
  </text>
</svg>
