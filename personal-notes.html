function escapeHTML(s){
  return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
}

function formatNoteContent(text){
  if(!text)return '';
  const rawBlocks=text.split(/\n\n+/);
  const blocks=rawBlocks.map(b=>b.trim()).filter(Boolean);
  const result=[];
  
  for(let i=0;i<blocks.length;i++){
    const trimmed=blocks[i];
    
    // 1. TOPIC X OF 11
    if(/^TOPIC\s+\d+\s+OF\s+\d+/i.test(trimmed)){
      result.push(`<div class="note-topic-tag"><span class="topic-icon">📌</span> ${escapeHTML(trimmed)}</div>`);
      continue;
    }
    
    // 2. Standalone review/takeaway header followed by the review content in next block
    const isStandaloneReview=/^(Last-minute review|Last-minute revision|30-second interview answer|30-Second Interview Summary|60-second interview answer|60-SECOND INTERVIEW ANSWER|Interview-ready answer|INTERVIEW-READY ANSWER|Interview-ready summary|Revision takeaway|Quick recall|Revision shortcut|REVISION SHORTCUT|Remember):?$/i.test(trimmed);
    if(isStandaloneReview && i+1<blocks.length){
      const label=trimmed.replace(/:$/,'').toUpperCase();
      i++;
      const bodyText=blocks[i];
      result.push(`<div class="note-callout note-callout-takeaway"><div class="callout-header"><span class="badge-t">⚡ ${escapeHTML(label)}</span></div><div class="callout-body takeaway-body">${escapeHTML(bodyText).replace(/\n/g,'<br>')}</div></div>`);
      continue;
    }
    
    // 3. Inline Last-minute review / Takeaways with body included
    if(/^(Last-minute review|Last-minute revision|30-second interview answer|30-Second Interview Summary|60-second interview answer|60-SECOND INTERVIEW ANSWER|Interview-ready answer|INTERVIEW-READY ANSWER|Interview-ready summary|Revision takeaway|Quick recall|Revision shortcut|REVISION SHORTCUT|Remember:?)/i.test(trimmed)){
      const match=trimmed.match(/^(Last-minute review:?|Last-minute revision:?|30-second interview answer:?|30-Second Interview Summary:?|60-second interview answer:?|60-SECOND INTERVIEW ANSWER:?|Interview-ready answer:?|INTERVIEW-READY ANSWER:?|Interview-ready summary:?|Revision takeaway:?|Quick recall:?|Revision shortcut:?|REVISION SHORTCUT:?|Remember:?)\s*/i);
      const prefix=match?match[0]:'';
      const rText=trimmed.substring(prefix.length);
      const label=prefix.replace(/:?\s*$/,'').toUpperCase()||'KEY TAKEAWAY';
      result.push(`<div class="note-callout note-callout-takeaway"><div class="callout-header"><span class="badge-t">⚡ ${escapeHTML(label)}</span></div><div class="callout-body takeaway-body">${escapeHTML(rText||trimmed).replace(/\n/g,'<br>')}</div></div>`);
      continue;
    }
    
    // 4. Questions: Q: ... or Q1. ... or Customer question: ... or Interview question: ... or Core interview question: ...
    if(/^(Q\d*[\.:]|Customer question:|Interview question:|Core interview question:)/i.test(trimmed)){
      const match=trimmed.match(/^(Q\d*[\.:]|Customer question:|Interview question:|Core interview question:)\s*/i);
      const prefix=match?match[0]:'';
      const qText=trimmed.substring(prefix.length);
      let label='QUESTION';
      if(prefix.toLowerCase().includes('customer')) label='CUSTOMER QUESTION';
      else if(/^Q\d+/i.test(prefix)) label=prefix.replace(/[\.:\s]/g,'').toUpperCase()+' QUESTION';
      else if(prefix.toLowerCase().includes('core')) label='CORE QUESTION';
      else label='INTERVIEW QUESTION';
      result.push(`<div class="note-callout note-callout-question"><div class="callout-header"><span class="badge-q">❓ ${escapeHTML(label)}</span></div><div class="callout-body q-title">${escapeHTML(qText||trimmed)}</div></div>`);
      continue;
    }
    
    // 5. Answers: A: ... or Interview answer: ... or INTERVIEW ANSWER
    if(/^(A:|A\s*:|Interview answer:|INTERVIEW ANSWER)/i.test(trimmed)){
      const match=trimmed.match(/^(A:|A\s*:|Interview answer:|INTERVIEW ANSWER:?)\s*/i);
      const prefix=match?match[0]:'';
      const aText=trimmed.substring(prefix.length);
      const label=prefix.toLowerCase().includes('interview')?'INTERVIEW ANSWER':'ANSWER';
      result.push(`<div class="note-callout note-callout-answer"><div class="callout-header"><span class="badge-a">💡 ${escapeHTML(label)}</span></div><div class="callout-body">${escapeHTML(aText||trimmed).replace(/\n/g,'<br>')}</div></div>`);
      continue;
    }
    
    // 6. Follow-ups: Follow-up: ... or Interviewer follow-up: ...
    if(/^(Follow-up|Interviewer follow-up)/i.test(trimmed)){
      const match=trimmed.match(/^(Follow-up[\w\s—\-]*:|Interviewer follow-up:)\s*/i);
      const prefix=match?match[0]:'';
      const fText=trimmed.substring(prefix.length);
      const label=prefix.replace(/:?\s*$/,'').toUpperCase()||'FOLLOW-UP';
      result.push(`<div class="note-callout note-callout-followup"><div class="callout-header"><span class="badge-f">🔄 ${escapeHTML(label)}</span></div><div class="callout-body">${escapeHTML(fText||trimmed).replace(/\n/g,'<br>')}</div></div>`);
      continue;
    }
    
    // 7. Scenarios: Scenario: ... or Scenario X: ... or Interview scenario: ... or Mini scenario: ... or Java scenario: ...
    if(/^(\d+\.\s+)?(Scenario\s*\d*:|Interview scenario:|Mini scenario:|Java scenario:)/i.test(trimmed)){
      const match=trimmed.match(/^(\d+\.\s+)?(Scenario\s*\d*:|Interview scenario:|Mini scenario:|Java scenario:)\s*/i);
      const prefix=match?match[0]:'';
      const sText=trimmed.substring(prefix.length);
      const label=prefix.replace(/:?\s*$/, '').trim().toUpperCase()||'SCENARIO';
      result.push(`<div class="note-callout note-callout-scenario"><div class="callout-header"><span class="badge-s">🎯 ${escapeHTML(label)}</span></div><div class="callout-body">${escapeHTML(sText||trimmed).replace(/\n/g,'<br>')}</div></div>`);
      continue;
    }
    
    // 8. Numbered Topic Headings: e.g. "1. Why do LLMs hallucinate?", "1. Harness - The AI Execution Environment", "Level 1 — ..."
    if((/^\d+\.\s+[A-Z]/.test(trimmed)||/^\d+\s+scenario-based/i.test(trimmed)||/^Level\s+\d+\s*[—\:]/i.test(trimmed)||/^Phase\s+\d+\s*[\:\—]/i.test(trimmed)||/^Stage\s+\d+\s*[\:\—\|]/i.test(trimmed)) && trimmed.length<110 && !trimmed.includes('\n')){
      const isQuestion=/\?$/.test(trimmed);
      result.push(`<h3 class="note-topic-heading"><span class="heading-text">${isQuestion?'<span class="q-mark">❓</span> ':''}${escapeHTML(trimmed)}</span></h3>`);
      continue;
    }
    
    // 9. Short Question Subheadings: e.g. "What is Kafka?", "Why MCP when APIs already exist?", "What is AGI?", "When could AGI arrive?"
    if(trimmed.length<85 && !trimmed.includes('\n') && /^(When|Where|What|Why|How)\s*.*\??$/i.test(trimmed)){
      result.push(`<h4 class="note-subheading note-q-subheading"><span class="subheading-bullet">❓</span> ${escapeHTML(trimmed)}</h4>`);
      continue;
    }
    
    // 10. Short Section Subheadings: e.g. "Continuous integration (CI)", "Packaging and the container registry", "Release controls", "Latency - Response time"
    if(trimmed.length<85 && !/[.!?]$/.test(trimmed) && !trimmed.includes('\n') && (i<2||/^(What is|Why |How |The |Stage |Phase |Level |Typical |Benefits |Definition |Key |Direct |Customizing |Thor:|Loki:|Kafka separates|Production scenarios|Latency|Throughput|Error rate|Resource utilization|SLA vs|Practical example|Quick Revision|Write path|Read path|Architecture comparison|Core Concepts|AI Spectrum|Progression|AI Architecture)/i.test(trimmed))){
      result.push(`<h4 class="note-subheading"><span class="subheading-bullet">◆</span> ${escapeHTML(trimmed)}</h4>`);
      continue;
    }
    
    // 11. Standard Paragraphs with inline keyword highlights
    let escaped=escapeHTML(trimmed).replace(/\n/g,'<br>');
    escaped=escaped.replace(/(Difference:)/g,'<strong class="hl-keyword hl-diff">$1</strong>');
    escaped=escaped.replace(/(Key nuance:)/g,'<strong class="hl-keyword hl-nuance">$1</strong>');
    escaped=escaped.replace(/(Technical nuance:)/g,'<strong class="hl-keyword hl-nuance">$1</strong>');
    escaped=escaped.replace(/(Important nuance:)/g,'<strong class="hl-keyword hl-nuance">$1</strong>');
    escaped=escaped.replace(/(Important:)/g,'<strong class="hl-keyword hl-nuance">$1</strong>');
    escaped=escaped.replace(/(Analogy:)/g,'<strong class="hl-keyword hl-analogy">$1</strong>');
    escaped=escaped.replace(/(Comparison:)/g,'<strong class="hl-keyword hl-diff">$1</strong>');
    escaped=escaped.replace(/(Safety:)/g,'<strong class="hl-keyword hl-safety">$1</strong>');
    escaped=escaped.replace(/(Flow:)/g,'<strong class="hl-keyword hl-flow">$1</strong>');
    escaped=escaped.replace(/(Caveat:)/g,'<strong class="hl-keyword hl-caveat">$1</strong>');
    escaped=escaped.replace(/(Interview tip:)/g,'<strong class="hl-keyword hl-tip">$1</strong>');
    escaped=escaped.replace(/(Key distinction:)/g,'<strong class="hl-keyword hl-nuance">$1</strong>');
    escaped=escaped.replace(/(Production guardrails:)/g,'<strong class="hl-keyword hl-prod">$1</strong>');
    escaped=escaped.replace(/(Production safeguards:)/g,'<strong class="hl-keyword hl-prod">$1</strong>');
    escaped=escaped.replace(/(Level \d+ —)/g,'<strong class="hl-keyword hl-level">$1</strong>');
    escaped=escaped.replace(/(Interview answer:)/g,'<strong class="hl-keyword hl-answer">$1</strong>');
    escaped=escaped.replace(/(Interview scenario:)/g,'<strong class="hl-keyword hl-scenario">$1</strong>');
    escaped=escaped.replace(/(Production controls include:)/g,'<strong class="hl-keyword hl-prod">$1</strong>');
    escaped=escaped.replace(/(In an interview I would say:)/g,'<strong class="hl-keyword hl-say">$1</strong>');
    escaped=escaped.replace(/(WRONG FINAL STATE)/g,'<strong class="hl-keyword hl-warn">$1</strong>');
    escaped=escaped.replace(/(FINAL RESULT)/g,'<strong class="hl-keyword hl-diff">$1</strong>');
    escaped=escaped.replace(/(CORE PATTERN)/g,'<strong class="hl-keyword hl-flow">$1</strong>');
    
    result.push(`<p class="note-paragraph">${escaped}</p>`);
  }
  
  return result.join('');
}

function render(){
  nav.innerHTML=cats.map(c=>`<button class="${selected===c?'active':''}" data-cat="${escapeHTML(c)}">${escapeHTML(c)}</button>`).join('');
  nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=b.dataset.cat;render()});
  
  let filtered=data.filter(x=>(selected==='All'||x.cat===selected)&&(`${x.title} ${x.heading} ${x.text}`.toLowerCase().includes(query)));
  document.getElementById('stats').textContent=`${filtered.length} sections shown • ${new Set(filtered.map(x=>x.title)).size} source documents`;
  
  results.innerHTML=filtered.length?filtered.map((x,i)=>`<details class="entry" ${query?'open':''}>
    <summary>
      <div>
        <span class="pill">${escapeHTML(x.cat)} · ${escapeHTML(x.title)}</span><br>
        <b>${escapeHTML(x.heading)}</b>
      </div>
      <span class="page-badge">Page ${x.page} <span class="toggle-icon">▾</span></span>
    </summary>
    <div class="content">
      ${x.image?`<img loading="lazy" src="${x.image}" alt="Original illustrated page ${x.page}">`:formatNoteContent(x.text)}
    </div>
  </details>`).join(''):'<div class="empty">No matching notes. Try another keyword.</div>';
}

document.getElementById('search').oninput=e=>{query=e.target.value.trim().toLowerCase();render()};
document.getElementById('expand').onclick=()=>{const a=[...document.querySelectorAll('details')];const open=a.some(x=>!x.open);a.forEach(x=>x.open=open);document.getElementById('expand').textContent=open?'Collapse all':'Expand all'};
document.getElementById('theme').onclick=()=>{document.body.classList.toggle('dark');document.getElementById('theme').textContent=document.body.classList.contains('dark')?'Light mode':'Dark mode'};
render();

</script></body></html>
