<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Interview Notes | Java, DevOps, Kafka & AI</title><style>:root{--bg:#f5f7fb;--paper:#ffffff;--ink:#17253b;--muted:#64748b;--accent:#2563eb;--accent-light:#eff6ff;--line:#e2e8f0;--card-shadow:0 2px 10px rgba(15,23,42,0.04);--hover-shadow:0 8px 24px rgba(37,99,235,0.09);--header-h:70px}
body.dark{--bg:#0c1424;--paper:#142137;--ink:#ecf2ff;--muted:#9baecb;--accent:#77a9ff;--accent-light:#1e293b;--line:#30425b;--card-shadow:0 2px 10px rgba(0,0,0,0.25);--hover-shadow:0 8px 24px rgba(0,0,0,0.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen,Ubuntu,Cantarell,sans-serif;min-height:100vh;overflow-x:hidden;transition:background-color .25s ease,color .25s ease}
header{position:sticky;top:0;z-index:100;background:var(--paper);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 2px 12px rgba(15,23,42,0.03);transition:background-color .25s ease,border-color .25s ease}
header>div{min-width:0;flex:0 1 auto}
header strong{font-size:18px;font-weight:700;letter-spacing:-.01em;color:var(--ink);display:inline-block;line-height:1.3}
header small{color:var(--muted);font-size:12.5px;display:inline-block;white-space:nowrap}
input,select,button{font:inherit;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);padding:9px 14px;outline:none;transition:all .2s ease}
input[type="search"]{min-width:180px;flex:1 1 260px;max-width:480px;height:42px;font-size:14px}
input[type="search"]::placeholder{color:var(--muted);opacity:.8}
input[type="search"]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,0.15)}
button{cursor:pointer;user-select:none;font-weight:500;font-size:13.5px;height:42px;display:inline-flex;align-items:center;justify-content:center;padding:0 16px;white-space:nowrap;flex-shrink:0}
button:hover{border-color:var(--accent);color:var(--accent)}
button:active{transform:scale(0.98)}
#theme{background:var(--bg)}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - var(--header-h));max-width:1440px;margin:0 auto}
aside{padding:24px 16px;border-right:1px solid var(--line);background:var(--paper);position:sticky;top:67px;height:calc(100vh - 67px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
aside::-webkit-scrollbar{width:5px}
aside::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
aside button{display:flex;align-items:center;width:100%;text-align:left;margin:5px 0;border:1px solid transparent;background:transparent;padding:10px 14px;border-radius:10px;color:var(--ink);font-size:14px;font-weight:500;height:auto;white-space:normal;word-break:break-word}
aside button:hover{background:var(--bg);color:var(--accent)}
aside button.active{background:var(--accent);color:#fff;font-weight:600;border-color:var(--accent);box-shadow:0 4px 12px rgba(37,99,235,0.28)}
main{max-width:1050px;width:100%;padding:28px 32px;margin:0 auto;box-sizing:border-box;min-width:0}
.intro{margin-bottom:22px}
.intro h1{margin:0 0 8px;font-size:clamp(22px,3.2vw,30px);line-height:1.25;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
.intro p{color:var(--muted);margin:0;font-size:clamp(13.5px,1.8vw,15px);line-height:1.6}
.stats{color:var(--muted);font-size:13px;font-weight:500;margin:16px 0 20px;padding:8px 14px;background:var(--paper);border:1px solid var(--line);border-radius:10px;display:inline-block;max-width:100%}
.entry{background:var(--paper);border:1px solid var(--line);border-radius:14px;margin:16px 0;overflow:hidden;box-shadow:var(--card-shadow);transition:border-color .2s ease,box-shadow .2s ease}
.entry:hover{border-color:var(--accent);box-shadow:var(--hover-shadow)}
.entry[open]{border-color:rgba(37,99,235,0.45);box-shadow:0 4px 20px rgba(37,99,235,0.08)}
body.dark .entry[open]{border-color:rgba(119,169,255,0.4);box-shadow:0 4px 20px rgba(0,0,0,0.35)}
.entry summary{cursor:pointer;padding:16px 20px;list-style:none;display:flex;gap:14px;justify-content:space-between;align-items:center;user-select:none;transition:background .15s ease}
.entry summary:hover{background:var(--bg)}
.entry summary::-webkit-details-marker{display:none}
.entry summary b{font-size:clamp(15.5px,2.1vw,17.5px);line-height:1.35;color:var(--ink);word-break:break-word;font-weight:750;transition:color .2s ease}
.entry[open] summary b{color:var(--accent)}
.entry summary .page-badge{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;flex-shrink:0;padding:4px 10px;background:var(--bg);border:1px solid var(--line);border-radius:20px;display:inline-flex;align-items:center;gap:4px;transition:all .2s ease}
.entry[open] summary .page-badge{background:var(--accent-light);color:var(--accent);border-color:rgba(37,99,235,0.3)}
.entry summary .toggle-icon{display:inline-block;transition:transform .2s ease}
.entry[open] summary .toggle-icon{transform:rotate(180deg)}
.content{border-top:1px solid var(--line);padding:24px;background:var(--paper);overflow-x:auto}
.content img{display:block;max-width:100%;height:auto;border-radius:10px;border:1px solid var(--line);margin:0 auto;box-shadow:0 4px 16px rgba(0,0,0,0.06)}
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:700;border:1px solid var(--line);border-radius:20px;padding:3px 10px;margin-bottom:8px;color:var(--muted);background:var(--bg);letter-spacing:.04em;text-transform:uppercase}
.highlight{background:#fef08a;color:#17253b;padding:1px 3px;border-radius:3px}
body.dark .highlight{background:#ca8a04;color:#fff}
.empty{padding:60px 20px;text-align:center;color:var(--muted);font-size:15px;background:var(--paper);border:1px dashed var(--line);border-radius:14px;margin:20px 0}

/* Distinct Highlighted Headers & Questions */
.note-topic-tag{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,rgba(37,99,235,0.1),rgba(124,58,237,0.1));border:1px solid rgba(37,99,235,0.25);color:#1d4ed8;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 12px;border-radius:20px;margin:4px 0 16px}
body.dark .note-topic-tag{background:linear-gradient(135deg,rgba(59,130,246,0.2),rgba(139,92,246,0.2));border-color:rgba(119,169,255,0.35);color:#93c5fd}
.note-topic-heading{display:flex;align-items:center;gap:8px;margin:26px 0 14px;padding:10px 14px;background:linear-gradient(90deg,rgba(37,99,235,0.08) 0%,rgba(37,99,235,0.01) 100%);border-left:4px solid var(--accent);border-radius:0 8px 8px 0;font-size:clamp(16px,2.1vw,18.5px);font-weight:800;color:var(--ink);letter-spacing:-0.01em;line-height:1.35}
body.dark .note-topic-heading{background:linear-gradient(90deg,rgba(119,169,255,0.12) 0%,transparent 100%);border-left-color:var(--accent);color:#f1f5f9}
.note-topic-heading:first-child{margin-top:0}
.note-subheading{margin:20px 0 10px;font-size:clamp(14.5px,1.8vw,16px);font-weight:700;color:var(--ink);line-height:1.4;display:flex;align-items:baseline;gap:8px}
.note-subheading .subheading-bullet{color:var(--accent);font-size:11px}
.note-q-subheading{color:#1e40af;background:rgba(37,99,235,0.04);padding:8px 12px;border-radius:8px;border-left:3px solid #3b82f6;margin:18px 0 10px}
body.dark .note-q-subheading{color:#93c5fd;background:rgba(59,130,246,0.1);border-left-color:#60a5fa}

/* Structured Callouts */
.note-callout{border-radius:10px;margin:14px 0;overflow:hidden;border:1px solid var(--line);transition:all .15s ease}
.note-callout .callout-header{padding:8px 14px 4px;display:flex;align-items:center}
.note-callout .callout-body{padding:4px 14px 12px;font-size:14.5px;line-height:1.7}
.note-paragraph{margin:0 0 14px;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;font-size:14.5px;line-height:1.7;color:var(--ink)}
.note-paragraph:last-child{margin-bottom:0}

/* Question Callout */
.note-callout-question{background:#f0f7ff;border:1px solid #bfdbfe;border-left:4px solid #2563eb}
body.dark .note-callout-question{background:rgba(30,58,138,0.22);border-color:rgba(59,130,246,0.3);border-left:4px solid #3b82f6}
.badge-q{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#1d4ed8;background:#dbeafe;padding:2px 9px;border-radius:12px;display:inline-flex;align-items:center;gap:4px}
body.dark .badge-q{color:#bfdbfe;background:rgba(37,99,235,0.35)}
.note-callout-question .q-title{font-size:15px;font-weight:650;color:#1e3a8a;line-height:1.55}
body.dark .note-callout-question .q-title{color:#e0e7ff}

/* Answer Callout */
.note-callout-answer{background:#f0fdf4;border:1px solid #bbf7d0;border-left:4px solid #10b981}
body.dark .note-callout-answer{background:rgba(6,78,59,0.2);border-color:rgba(16,185,129,0.25);border-left:4px solid #10b981}
.badge-a{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#047857;background:#d1fae5;padding:2px 9px;border-radius:12px;display:inline-flex;align-items:center;gap:4px}
body.dark .badge-a{color:#6ee7b7;background:rgba(16,185,129,0.25)}
.note-callout-answer .callout-body{color:#064e3b}
body.dark .note-callout-answer .callout-body{color:#ecfdf5}

/* Scenario Callout */
.note-callout-scenario{background:#faf5ff;border:1px solid #e9d5ff;border-left:4px solid #9333ea}
body.dark .note-callout-scenario{background:rgba(88,28,135,0.2);border-color:rgba(168,85,247,0.3);border-left:4px solid #a855f7}
.badge-s{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#7e22ce;background:#f3e8ff;padding:2px 9px;border-radius:12px;display:inline-flex;align-items:center;gap:4px}
body.dark .badge-s{color:#d8b4fe;background:rgba(147,51,234,0.3)}
.note-callout-scenario .callout-body{color:#4c1d95}
body.dark .note-callout-scenario .callout-body{color:#f3e8ff}

/* Follow-up Callout */
.note-callout-followup{background:#fffbeb;border:1px solid #fde68a;border-left:4px solid #d97706}
body.dark .note-callout-followup{background:rgba(120,53,15,0.2);border-color:rgba(245,158,11,0.3);border-left:4px solid #f59e0b}
.badge-f{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#b45309;background:#fef3c7;padding:2px 9px;border-radius:12px;display:inline-flex;align-items:center;gap:4px}
body.dark .badge-f{color:#fde68a;background:rgba(217,119,6,0.3)}
.note-callout-followup .callout-body{color:#78350f}
body.dark .note-callout-followup .callout-body{color:#fef3c7}

/* Takeaway Callout */
.note-callout-takeaway{background:#fff1f2;border:1px solid #fecdd3;border-left:4px solid #e11d48}
body.dark .note-callout-takeaway{background:rgba(136,19,55,0.2);border-color:rgba(244,63,94,0.3);border-left:4px solid #f43f5e}
.badge-t{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#be123c;background:#ffe4e6;padding:2px 9px;border-radius:12px;display:inline-flex;align-items:center;gap:4px}
body.dark .badge-t{color:#fecdd3;background:rgba(225,29,72,0.3)}
.note-callout-takeaway .callout-body{color:#881337;font-weight:500}
body.dark .note-callout-takeaway .callout-body{color:#ffe4e6}

/* Inline Keyword Highlights */
.hl-keyword{display:inline-block;padding:1px 6px;border-radius:4px;font-size:13.5px;font-weight:700;margin-right:2px}
.hl-diff{background:#e0f2fe;color:#0369a1;border-bottom:2px solid #0284c7}
body.dark .hl-diff{background:rgba(3,105,161,0.25);color:#7dd3fc;border-bottom-color:#38bdf8}
.hl-nuance{background:#fef3c7;color:#92400e;border-bottom:2px solid #d97706}
body.dark .hl-nuance{background:rgba(146,64,14,0.25);color:#fcd34d;border-bottom-color:#fbbf24}
.hl-level{background:#f3e8ff;color:#6b21a8;border-bottom:2px solid #9333ea}
body.dark .hl-level{background:rgba(107,33,168,0.25);color:#d8b4fe;border-bottom-color:#a855f7}
.hl-answer{background:#dcfce7;color:#166534;border-bottom:2px solid #16a34a}
body.dark .hl-answer{background:rgba(22,101,52,0.25);color:#86efac;border-bottom-color:#4ade80}
.hl-scenario{background:#f5f3ff;color:#5b21b6;border-bottom:2px solid #7c3aed}
body.dark .hl-scenario{background:rgba(91,33,182,0.25);color:#c4b5fd;border-bottom-color:#8b5cf6}
.hl-prod,.hl-say{background:#f1f5f9;color:#334155;border-bottom:2px solid #64748b}
body.dark .hl-prod,body.dark .hl-say{background:rgba(51,65,85,0.4);color:#cbd5e1;border-bottom-color:#94a3b8}
.hl-analogy{background:#ecfdf5;color:#047857;border-bottom:2px solid #10b981}
body.dark .hl-analogy{background:rgba(16,185,129,0.2);color:#6ee7b7;border-bottom-color:#10b981}
.hl-safety,.hl-warn{background:#fef2f2;color:#b91c1c;border-bottom:2px solid #ef4444}
body.dark .hl-safety,body.dark .hl-warn{background:rgba(239,68,68,0.2);color:#fca5a5;border-bottom-color:#ef4444}
.hl-flow{background:#eff6ff;color:#1d4ed8;border-bottom:2px solid #3b82f6}
body.dark .hl-flow{background:rgba(59,130,246,0.2);color:#93c5fd;border-bottom-color:#3b82f6}
.hl-caveat,.hl-tip{background:#fffbeb;color:#b45309;border-bottom:2px solid #f59e0b}
body.dark .hl-caveat,body.dark .hl-tip{background:rgba(245,158,11,0.2);color:#fde68a;border-bottom-color:#f59e0b}

@media(max-width:900px){.layout{grid-template-columns:220px minmax(0,1fr)}main{padding:22px 20px}}

}
@media(max-width:480px){

@media print{

body{background:#fff!important;color:#000!important}

eS54D2zQkN+M3RkgFp2/Zx+n+Pk9fs3nAY0KiLrq6+968VaBQRAATyht/aCWGNbatdaxdcoGAu4x4wp3K2J4Net5wqbASC9UP3JDR0NuPWO8/Vn84AyKzIPUqxygKdg5bg0fsf7vsgRVIDrthw3sQBNV1X0md5uqvHXU7jw0QocWTcYj63K2JbRImj9lwE60XfXsdu+LN8giBwS89cDZ806e+tqdLm9wQ0KdL5n7qRRFWu+45+rP5xh1N6Me1dPnOriie529P2cfp/j5PX/GqMakqvHb97oLCFBBL4pgIBI5ZH0pc8/Dz8ARSkm0IAcbDf7H+77qahUdveT7DEhjzoPmAx1hu4j8Vxav3bTuAPg/dtPQwp+/kzPBaGj7hggD0gryUuefh5+FJBJrBsA7939nH6f4+T1/2n+79lQyAjvA32LfbBMGDc+Kd5/oMaToSGij8r7YWYLQinR/bx+n+Pk9f95NAcVRPJh8i50vQMvkz9T/zn6n/nP1P/ADn6n/nP1P8Azn6n/nP1P/Ofqf8AnP1P/Ofqf+c/U/8AOfqf+c/U/wDOfqf+c/U/85sawq58rgAAAQDp+3j9P8ZKjHPIZ5DPIZ5DPIZ5DPIZ5DPIZ5DPIZ5DPIZ5DPIZ5DPIZ5DPIZ5DPIZ5DPIZ5DPIZ5DPIZ5DPIZ5DPIZ5DPIZ5DPIZ5DPIZ5DPIZ5DPIZ5DPIZ5DPIZ5DPIZ5DPIZ5DPIZBqv/oBsJ2dAVZS7Dr1wnVCj3/75cyaBD4/+D//2Q=="},{"title":"CI/CD Pipeline","cat":"DevOps","page":1,"heading":"Continuous integration (CI)","text":"CI/CD\n\nLearning Notes | Pipeline fundamentals and your Loki / Thor workflow\n\nContinuous integration (CI)\n\nContinuous integration is the practice of integrating code changes frequently and checking them with automated builds and tests. In the example from your voice note, a developer pushes code and a configured event starts the pipeline.\n\nThe pipeline builds the application into a runnable or packageable form and runs automated tests. A failed required build or test step blocks downstream release stages. When checks pass, the application can be packaged as an artifact, such as a JAR, and then as a Docker image.\n\nPackaging and the container registry\n\nA Docker image contains the packaged application and the runtime components defined by its image build. The image is pushed to a container registry, where it becomes available for deployment. A successful image build makes a version available; it does not by itself deploy that version.\n\nContinuous delivery and continuous deployment\n\nContinuous delivery: Changes pass automated checks and are kept ready for release. A person can approve or trigger deployment to production.\n\nContinuous deployment: Changes that pass all required pipeline checks are deployed to production automatically, without a manual release gate.\n\nA typical workflow deploys the tested version to staging, an environment designed to resemble production, for further verification. After verification, that same version is promoted to production. Exact environments and gates vary between teams.\n\nTypical pipeline flow\n\nCode push → Build → Tests → Package / Docker image → Registry → Staging verification →\n\nProduction release\n\nHow this relates to your example\n\nYou described Loki as the CI tool used to configure and run build-related steps, checks, image creation, and notifications. Thor handles deployment of the selected image. Your team uses a manual deployment action in Thor, so the workflow has a continuous-delivery release gate.\n\nLoki and Thor details below record your own workflow. They are not universal product behavior or a\n\nreference to Grafana Loki. The employer attribution was mixed in the voice note, so these notes keep the\n\ntool workflow without assigning it to IBM or Lowe's.\n\nCI/CD | Learning notes 1","image":""},{"title":"CI/CD Pipeline","cat":"DevOps","page":2,"heading":"Loki: configuration and build","text":"Loki: configuration and build\n\nYour Java / Maven pipeline example\n\nThe pipeline configuration file\n\nYou described a .loki.yml file defining build steps, deployment-related configuration, and notification steps. The filename is recorded as spoken; the exact filename and supported fields should follow your repository's configuration.\n\nThe configuration identifies what the pipeline should run, which files or paths it should use, and which conditions allow the job to start. Different languages can use different build commands.\n\nThe execution sequence you described\n\n1. Read the definitions. Loki evaluates the configured pipeline steps and relevant execution conditions.\n\n2. Clone or check out the source code. The job retrieves the repository content for the selected branch, tag, or commit.\n\n3. Build the Java application. Your Maven command is mvn clean install. The clean lifecycle removes previous build output; install runs the configured default lifecycle through installation into the local Maven repository. This normally includes compilation, tests, packaging, and verification as configured by the project.\n\nMaven commonly writes generated build artifacts to target/. Running install is not the same as deploying the application to an environment. Tests and plugins depend on project configuration and any skip flags.\n\n4. Run Sonar checks. Your workflow runs Sonar analysis after the Maven build and supplies the relevant project configuration or paths. Analysis results and an enforced quality gate are separate concerns: blocking later stages requires the pipeline to enforce the gate result.\n\n5. Run Snyk checks. You described Snyk integration after Sonar. The pipeline uses the configured scan settings to evaluate the project. The exact scan type and blocking rules depend on your setup.\n\n6. Build the Docker image. The pipeline uses the configured image-build instructions and paths. A Dockerfile defines image build instructions; YAML may configure the pipeline or deployment. The voice note did not establish which Docker-related file your setup references.\n\n7. Publish the deployment artifact. In the general CI/CD flow, the resulting image is stored in a container registry so deployment tooling can retrieve the selected version.\n\nYour build sequence\n\nRead configuration → Check out code → Maven build → Sonar → Snyk → Docker image →\n\nRegistry\n\nCI/CD | Learning notes 2","image":""},{"title":"CI/CD Pipeline","cat":"DevOps","page":3,"heading":"Release controls","text":"Release controls\n\nCustom conditions and the Thor release step\n\nCustomizing when Loki runs\n\nYour pipeline can be configured to run for particular branches or tags, and for events such as a push, pull request, or manual build. These conditions determine whether the relevant job or step is eligible to execute.\n\nFor example, a team might run checks on a pull request and reserve image publication for a selected branch or tag. This is an illustration of the customization you described, not a claim that those are your exact configured rules.\n\nNotifications and reports\n\nYou described a notification section containing the configuration needed to send build results to a distribution list (DL) or email group. On success, the configured recipients receive a build-success notification and the associated report or report reference.\n\nYour voice note also mentions a local path in this section. Its exact purpose was not specified, so no recipient addresses, path values, or notification schema are invented here. A build-success notification confirms the build outcome, not necessarily a production deployment.\n\nThor: deploy the selected image\n\nOnce the image is available, Thor provides the deployment step. You explained that deployment can be configured as manual or automated. In your team's setup, a person opens Thor, selects the specific image, and clicks the deployment action.\n\nThor then runs the configured deployment process for that image. The manual action is the release gate; the steps after the click can still be automated. Deployment success should be judged from the deployment result, rather than the earlier build result alone.\n\nYour described handoff\n\nLoki builds and checks the application → Image becomes available → Person selects the image\n\nin Thor → Thor performs deployment\n\nKey distinctions for future learning\n\nBuild versus deployment: Building creates an artifact. Deployment makes a selected artifact run in a target environment. Delivery versus deployment: A manual release gate fits continuous delivery; automatic production release after all checks fits continuous deployment. Configuration versus execution: YAML declares the workflow; the CI/CD tools execute the configured steps. Promote the tested version: Using the same image across environments helps preserve the relationship between verification and release.\n\nSources: your voice notes for Loki and Thor. General terminology checked against AWS: Understanding\n\nCI/CD. Maven command behavior checked against Apache Maven: Build Lifecycle.\n\nCI/CD | Learning notes 3","image":""},{"title":"Apache Kafka","cat":"Distributed Systems","page":1,"heading":"Apache Kafka","text":"Apache Kafka\n\nDistributed Event Streaming | Learning Notes\n\nWhat is Kafka?\n\nApache Kafka is a distributed event streaming platform. It stores events and allows multiple services to read and process them independently. An event records something that happened, such as an order being placed.\n\nKafka separates the service that publishes an event from the services that react to it. The publishing service writes the event to Kafka, and different consumers can use it for their own purposes.\n\nThe example: placing a food order\n\nImagine placing an order in a food-delivery application such as Swiggy. The Order Service generates an OrderPlaced event containing information about that order. This is a conceptual example from the voice note, rather than a claim about Swiggy's actual implementation.\n\nA Notification Service can read this event and send an order confirmation. An Analytics Service can independently read the same event and update a report. The Order Service does not need to implement those downstream tasks itself.\n\nThe main building blocks\n\nProducer: An application or service that publishes events to Kafka. In the example, the Order Service is the producer.\n\nTopic: A named stream of related events. For example, an orders topic can contain order-related events. Producers publish to a topic, and consumers subscribe to read its events.\n\nPartition: A topic can be divided into multiple partitions. Each partition is an ordered log in which events are appended in sequence. Partitions allow data to be distributed across brokers and allow consumers to work in parallel.\n\nBroker: A Kafka server that stores and serves partition data. Multiple brokers form a Kafka cluster. Partitions can be replicated across brokers for fault tolerance; each partition has a leader and, when configured, follower replicas.\n\nOrdering matters\n\nKafka preserves the stored event order within each partition. A topic with multiple partitions does\n\nnot have one guaranteed overall order across all partitions.\n\nApache Kafka | Learning notes 1","image":""},{"title":"Apache Kafka","cat":"Distributed Systems","page":2,"heading":"Reading and tracking events","text":"Reading and tracking events\n\nConsumers, consumer groups, and offsets\n\nConsumer: An application or service that reads events from Kafka. In the example, the Notification Service and Analytics Service are consumers.\n\nConsumer group: A group of consumers that coordinate to read a topic. In the standard consumer-group model, a partition is assigned to one consumer in a group at a time. Different partitions can be assigned to different consumers, allowing parallel processing.\n\nWhy the two services use separate groups\n\nThe Notification Service belongs to a notification consumer group, while the Analytics Service belongs to a separate analytics consumer group. Each group has its own reading progress, so both can process the same OrderPlaced event independently.\n\nIf the services were instead members of the same consumer group, partition assignments would divide the work between them. That would not ensure that both services receive every event. Separate groups are appropriate when each service needs its own view of the event stream.\n\nOffsets: positions inside a partition\n\nEach event has an offset: a numerical position within its partition. An offset identifies a position in a particular partition, rather than a globally unique position across the entire topic.\n\nConsumers track their current reading position, and each consumer group can commit progress for each partition. A committed offset normally identifies the next record to read after a restart. If records through offset 42 have been successfully processed, the application can commit offset 43.\n\nOffsets do not, by themselves, prove that business processing succeeded. Reliability depends on when the application commits its progress relative to processing the event. Independent groups can therefore have different committed offsets for the same partition.\n\nThe complete order-event flow\n\n1. The customer places an order. 2. The Order Service produces an OrderPlaced event. 3. Kafka appends the event to a partition of the orders topic. 4. Brokers store and serve the partition data. 5. The notification group reads the event and sends confirmation. 6. The analytics group independently reads it and updates reporting. 7. Each group records its own progress through offsets.\n\nRemember\n\nProducers publish. Topics organize. Partitions store ordered events. Brokers host the data.\n\nConsumers process events. Consumer groups track independent progress.\n\nBased on your voice note. Technical references: Apache Kafka introduction and Kafka design\n\ndocumentation.\n\nApache Kafka | Learning notes 2","image":""},{"title":"MCP vs API","cat":"AI & LLM","page":1,"heading":"MCP vs API","text":"MCP vs API\n\nModel Context Protocol | Learning Notes\n\nWhy MCP when APIs already exist?\n\nAn API (Application Programming Interface) defines how software components communicate. For example, an application that displays Slack messages can integrate Slack APIs: a developer configures authentication, chooses endpoints, sends requests, and handles responses.\n\nAn AI application can also use direct API integrations. If a user asks an AI assistant to summarize today's messages from a Slack channel, developers can build the logic that exposes Slack operations to the model and executes the appropriate API calls. This code lives in the application or integration layer, rather than inside the language model itself.\n\nThe integration problem\n\nIf several AI applications need access to Slack and other services, each application may otherwise need its own adapters and tool definitions. Repeating that work across applications and services increases implementation and maintenance effort.\n\nMCP (Model Context Protocol) provides a standard way for AI applications to connect to external tools and data sources. It standardizes how capabilities are exposed, discovered, and invoked, reducing the need for separate custom integration interfaces for every application.\n\nThe components in the Slack example\n\nHost: The AI application the user interacts with. In the voice note, Claude is the example host; other applications can play the same role when they support MCP.\n\nMCP client: The component used by the host to communicate with an MCP server. It obtains available tool definitions and sends tool calls.\n\nMCP server: A service that exposes capabilities through MCP. A Slack MCP server can expose operations such as searching messages and reading threads. These are illustrative capabilities; exact tool names and inputs depend on the server implementation.\n\nTool definitions: Tools have names, descriptions, and structured input definitions, allowing the host and model to understand what each tool does and which arguments it expects.\n\nKey relationship\n\nThe AI application communicates with an MCP server through its MCP client. The server can use\n\nSlack's existing API to carry out the operation.\n\nMCP vs API | Learning notes 1","image":""},{"title":"MCP vs API","cat":"AI & LLM","page":2,"heading":"How the request works","text":"How the request works\n\nExample: summarize today's Slack channel messages\n\n1. Discover the available tools. The host's MCP client connects to the configured Slack MCP server and obtains its available tool definitions. The host makes relevant tools available to the model.\n\n2. Select a tool and arguments. Given the user's request, the model can propose a message-search tool with the channel and date range as inputs. The application controls execution and any required permission checks.\n\n3. Send the tool call. The MCP client forwards the requested operation and its inputs to the MCP server.\n\n4. Fetch the messages. The Slack MCP server handles the request and calls Slack's actual API using the configured authentication and access permissions.\n\n5. Return the results. The server returns the retrieved messages through the MCP client to the host application, which supplies the results to the model.\n\n6. Generate the summary. The model reads the returned messages and produces a summary for the user.\n\nAPI and MCP: the practical difference\n\nAspect Direct API integration MCP integration\n\nInterface Service-specific endpoints and\n\nStandard protocol for exposing\n\ncapabilities\n\ncontracts\n\nBuild API calls and app-specific\n\nBuild/reuse a server and configure the\n\nDeveloper\n\nadapters\n\nhost\n\nwork\n\nDiscovery Usually based on API docs or schemas Tool definitions discovered through MCP\n\nExecution Application executes API requests Client calls server; server performs\n\noperation\n\nReuse Depends on shared libraries/adapters Server reusable across compatible\n\nhosts\n\nClarifications to remember\n\nMCP does not replace APIs or eliminate integration code. APIs can also have machine-readable schemas and power AI tools without MCP. MCP adds a shared integration protocol. Reuse still depends on host support, compatible capabilities, configuration, and authorization.\n\nSource: your voice note. Architecture cross-check: Microsoft Learn - Get started with .NET AI and MCP.\n\nMCP vs API | Learning notes 2","image":""},{"title":"RAG","cat":"AI & LLM","page":1,"heading":"Retrieval-Augmented Generation | Learning Notes","text":"RAG\n\nRetrieval-Augmented Generation | Learning Notes\n\nWhat is RAG?\n\nRetrieval-Augmented Generation (RAG) is a technique in which relevant information is retrieved from an external data source and provided to a Large Language Model (LLM) before it generates an answer. The retrieved text gives the model context for responding to the user's question.\n\nThe example: a company policy chatbot\n\nAn e-commerce company has thousands of pages describing its return, refund, and delivery policies. It wants an AI chatbot to answer customer questions using those documents. RAG makes relevant policy sections available to the LLM when a question is asked.\n\nThe complete process has two stages: preparing and indexing the documents, followed by retrieving information and generating an answer.\n\nStage 1: Prepare and index the documents\n\n1. Split documents into chunks. The documents are divided into smaller text sections called chunks. This lets the system find and retrieve the relevant section instead of supplying all the policy documents for every question.\n\n2. Generate embeddings. Each chunk is passed through an embedding model, which converts the text into a numerical vector. These vectors represent aspects of the text's meaning and allow the system to compare text by semantic similarity.\n\n3. Store the embeddings and text references. The embeddings are stored and indexed in a vector database, together with the corresponding text or a reference to the original chunk. When a matching vector is found, the system can retrieve the policy text associated with it.\n\nDocument preparation flow\n\nDocuments → Chunks → Embeddings → Vector database\n\nAt this point, the reference data is prepared for retrieval. The LLM has not been retrained on the policy documents.\n\nRAG | Learning notes from your voice note 1","image":""},{"title":"RAG","cat":"AI & LLM","page":2,"heading":"From question to answer","text":"From question to answer\n\nStage 2 | Retrieval and generation\n\nCustomer question: \"Can I return my phone after ten days?\"\n\n1. Embed the question. The system uses the same embedding model used for the document chunks to convert the customer's question into a numerical vector.\n\n2. Perform a similarity search. The vector database compares the question vector with the stored chunk vectors and finds the chunks most relevant to the meaning of the question.\n\n3. Retrieve the relevant policy. In this example, the matching chunk says: \"Phones can be returned within seven days of delivery.\" The system retrieves this policy text as context for the answer.\n\n4. Give the question and context to the LLM. The prompt contains the customer's original question and the retrieved policy information. The LLM uses that information to formulate its response.\n\n5. Generate the answer. Based on the stated policy, a return ten days after delivery falls outside the seven-day return window. The answer follows the retrieved policy rather than relying only on the model's general knowledge.\n\nQuestion-answering flow\n\nQuestion → Question embedding → Similarity search → Relevant chunks → LLM with question\n\nand context → Answer\n\nBenefits and policy updates\n\nCompany-specific answers: RAG supplies relevant information from the company's actual documents, allowing the chatbot to answer questions about its policies.\n\nReduced hallucination risk: Retrieved context provides a factual basis for generation. RAG reduces the risk of unsupported answers, but does not eliminate it; retrieval can miss relevant content and the model can still misinterpret the context.\n\nUpdated information without LLM retraining: If the return policy changes, the affected document content is processed again and its indexed chunks and embeddings are updated. Outdated indexed content should be replaced or removed so it does not continue to support old answers.\n\nRemember: Retrieval finds relevant information. Generation uses that information to produce an\n\nanswer.\n\nRAG | Learning notes from your voice note 2","image":""},{"title":"Java + AI Detailed Handbook","cat":"Java & AI","page":1,"heading":"TOPIC 1 OF 11","text":"TOPIC 1 OF 11\n\nLLM Hallucinations and Grounded Answers\n\nAn LLM generates probable next tokens rather than consulting a guaranteed source of truth. A hallucination occurs when the generated answer contains unsupported or incorrect claims, even if the language sounds confident.\n\nImagine a customer-support assistant invents a refund exception. The impact is not merely a wrong sentence: customers may rely on it, support teams may have to honor it, and trust suffers.\n\nIn an interview I would say: I first distinguish a retrieval problem from a generation problem. Did the correct policy reach the model? If not, fix retrieval and document indexing. If yes, strengthen the prompt to use only supplied evidence, require citations, and abstain when evidence is missing.\n\nProduction controls include RAG grounding, access-controlled retrieval, output validation, policy-specific deterministic checks, versioned documents, and evaluation sets. Temperature reduction may improve consistency but cannot guarantee factuality.\n\nFollow-up: Can RAG eliminate hallucinations? No. Retrieved context can be irrelevant, stale, or misinterpreted. Measure factual groundedness separately from retrieval quality.\n\nLast-minute review: Hallucination is an unsupported answer. Ground with trusted context, verify critical claims, and design a safe 'I don't know' path.\n\nJava + AI Engineering | Detailed Interview Handbook 1","image":""},{"title":"Java + AI Detailed Handbook","cat":"Java & AI","page":2,"heading":"TOPIC 2 OF 11","text":"TOPIC 2 OF 11\n\nAI Systems: Prompting, Reliability and Operational Trade-offs\n\nFor production AI, a good prompt is only one part of the system. Instructions, tool permissions, data access, deterministic business rules, logging, and evaluation together determine reliability.\n\nSystem instructions define the assistant's operating boundaries; user prompts supply the task. Neither should be treated as a security boundary for sensitive operations. Tool calls require server-side authorization and input validation.\n\nScenario: An assistant can read order status but should not issue a refund without checking eligibility. The model may propose the action; the Spring Boot service validates identity, refund policy, and idempotency before executing it.\n\nInterview answer: I keep business invariants in code and databases, not in natural-language prompts. I track token usage, response latency, errors, groundedness, and cost per successful task.\n\nFollow-up: What if the model is unavailable? Apply timeouts, bounded retries for safe calls, fallbacks, and clear user-facing errors. Never silently fabricate a result.\n\nLast-minute review: LLM for language and reasoning; backend for authorization, state changes, and guarantees.\n\nJava + AI Engineering | Detailed Interview Handbook 2","image":""},{"title":"Java + AI Detailed Handbook","cat":"Java & AI","page":3,"heading":"TOPIC 3 OF 11","text":"TOPIC 3 OF 11\n\nRAG Architecture: Indexing, Retrieval and Generation\n\nRAG stands for Retrieval-Augmented Generation. It lets an LLM use relevant external information at answer time instead of relying only on its training data. Explain it in two phases: indexing, then retrieval and generation.\n\nIndexing phase: Collect company return-policy documents; clean and split them into coherent chunks; create an embedding for each chunk; store vectors alongside source text, document identifiers, effective dates, and access metadata in a searchable index.\n\nQuery phase: A customer asks, 'Can I return my phone after 10 days?' Embed the question using a compatible embedding model, retrieve relevant policy chunks by similarity search (optionally hybrid keyword search and reranking), and pass the question plus retrieved evidence to the LLM.\n\nIf the current policy allows phone returns within seven days, the grounded answer is that the phone is outside the ordinary return window, subject to any documented exceptions. The model should cite the policy and avoid inventing exceptions.\n\nFollow-up 1 — wrong chunks: inspect chunk boundaries, metadata filters, embedding quality, retrieval recall, and reranker results. Distinguish retrieval failure from answer-generation failure.\n\nFollow-up 2 — policy changes from seven to fourteen days: reprocess changed documents, update or replace old index entries, enforce version/effective-date filtering, and invalidate stale caches. Avoid mixing obsolete and current policy.\n\nFollow-up 3 — no evidence: respond that the answer is not available in the provided policy and offer escalation; do not guess.\n\nFollow-up 4 — security: enforce tenant and document permissions during retrieval, before content reaches the model. Prompt instructions alone are insufficient.\n\nFollow-up 5 — scale: cache safe repeated queries, tune top-k, use hybrid search and reranking selectively, batch indexing, and measure retrieval and model latency separately.\n\nFollow-up 6 — RAG vs fine-tuning: RAG is usually better for changing factual knowledge and source citation; fine-tuning can improve specialized behavior or output style. They can complement each other.\n\nEvaluation: measure retrieval recall/precision on labeled queries, answer correctness, groundedness, citation quality, latency, and cost.\n\nLast-minute review: Documents → chunks → embeddings → vector index; question → retrieval → context → LLM answer. RAG reduces hallucination risk but never guarantees correctness.\n\nJava + AI Engineering | Detailed Interview Handbook 3","image":""},{"title":"Java + AI Detailed Handbook","cat":"Java & AI","page":4,"heading":"TOPIC 4 OF 11","text":"TOPIC 4 OF 11\n\nProduction AI Architecture: Practical Interview Follow-ups\n\nAn interview-ready AI design answer should move from the user request to the data boundary, model invocation, validation, and observability.\n\nScenario: A Java Spring Boot order assistant receives 'Where is my package?' The backend authenticates the user, fetches authorized order data through a tool, supplies only the necessary context to the model, and returns a concise explanation. The model never decides which orders the user may access.\n\nTool calling is not the same as direct model access to infrastructure. The application owns tool schemas, validates parameters, enforces permissions, applies timeouts, and records audit events.\n\nA workflow has predefined steps and branching rules; an agent may dynamically choose which allowed tools to call. For predictable financial operations, favor explicit workflows and human approval for consequential actions.\n\nInterviewer follow-up: How do you test it? Maintain representative and adversarial test cases, score factuality and tool choice, and compare prompt/model versions before rollout.\n\nInterviewer follow-up: How do you control cost? Limit context, cache safe results, route simple tasks to cheaper models, and track cost per resolved request rather than token cost alone.\n\nLast-minute review: Model outputs are suggestions; trusted services enforce business logic and permissions.\n\nJava + AI Engineering | Detailed Interview Handbook 4","image":""},{"title":"Java + AI Detailed Handbook","cat":"Java & AI","page":5,"heading":"TOPIC 5 OF 11","text":"TOPIC 5 OF 11\n\nAI and LLM Fundamentals: 19 Quick Definitions\n\nLLM: A large language model trained to predict and generate language. Scenario: draft a support reply using approved policy context.\n\nToken: A unit of model input or output, often a word fragment. Scenario: long conversations consume more tokens and cost.\n\nContext window: Maximum tokens a model can consider in one request, including instructions and retrieved text. Scenario: trim irrelevant history before sending a large document.\n\nPrompt: Instructions and context provided to a model. Scenario: ask for a JSON order summary.\n\nSystem prompt: Higher-priority application instructions describing role and behavior; not a security enforcement mechanism. Scenario: require grounded support answers.\n\nHallucination: An unsupported or incorrect model claim. Scenario: invented refund eligibility.\n\nTemperature: Sampling parameter influencing output variability; lower values often give more repeatable outputs, not guaranteed accuracy.\n\nRAG: Retrieval-Augmented Generation, using retrieved information to ground an answer. Full explanation is in Topic 3.\n\nEmbedding: Numerical vector representation of meaning. Scenario: match 'refund' with 'reimbursement' despite different wording.\n\nVector database: Storage/index for similarity search over embeddings, commonly with metadata filters. Scenario: retrieve policy paragraphs.\n\nFine-tuning: Further training a model on task-specific examples to change behavior or performance. Scenario: consistent domain-specific classification.\n\nAgent: A model-driven system that can choose actions or tools toward a goal within controls. Scenario: investigate an order using permitted APIs.\n\nWorkflow: A predetermined sequence of steps, possibly with branching. Scenario: validate → charge → notify.\n\nTool calling: Structured model request for an application-executed function. Scenario: getOrderStatus(orderId), with server-side authorization.\n\nMCP: Model Context Protocol, a standard way to expose tools and context to AI clients; permissions and trust still need enforcement.\n\nEvals: Repeatable tests and metrics for AI quality, safety, and task success. Scenario: check refund-answer correctness across a benchmark.\n\nHuman in the loop: A person reviews or approves selected actions. Scenario: approve a high-value refund.\n\nJava + AI Engineering | Detailed Interview Handbook 5","image":""},{"title":"Java + AI Detailed Handbook","cat":"Java & AI","page":6,"heading":"Guardrails: Layered controls on inputs, outputs, data access, and tool actions. Scenario: prevent cross-c","text":"Guardrails: Layered controls on inputs, outputs, data access, and tool actions. Scenario: prevent cross-customer data exposure.\n\nLatency: Elapsed time to get a response; inference cost is the money or compute spent serving the model. Scenario: balance answer quality against response time and token spend.\n\nInterview wrap-up: Define the term in one sentence, give a concrete backend scenario, and identify its production limitation.\n\nJava + AI Engineering | Detailed Interview Handbook 6","image":""},{"title":"Java + AI Detailed Handbook","cat":"Java & AI","page":7,"heading":"TOPIC 6 OF 11","text":"TOPIC 6 OF 11\n\nObserver Pattern: Eight Levels of Follow-up\n\nLevel 1 — What is Observer? When an order is placed, email, SMS, and analytics each react to the order event. The publisher notifies subscribed observers without embedding every reaction in the order logic.\n\nLevel 2 — Why not direct calls? With three consumers today and ten tomorrow, direct dependencies force repeated order-service changes. Observer-style decoupling supports extension and separation of concerns, although the publisher still owns event contracts.\n\nLevel 3 — Implementation: Define OrderObserver.onOrderPlaced(event); EmailObserver, SmsObserver, and AnalyticsObserver implement it. OrderService keeps subscribers and notifies them after successful persistence. In Spring, application events can support in-process observers.\n\nLevel 4 — What if email fails? A single uncaught exception may interrupt a synchronous loop and prevent SMS. Isolate observer failures, but also consider asynchronous processing and the impact on request latency.\n\nLevel 5 — How to retry missed email? Persist notification intent and status, retry transient failures with backoff and a cap, and send permanent failures to investigation or a dead-letter queue.\n\nLevel 6 — How to avoid duplicate email? A status check alone has a crash gap: the provider may accept the email before the database records SENT. Retries can duplicate the side effect. Use provider-supported idempotency where possible and acknowledge at-least-once semantics.\n\nLevel 7 — Two threads race: both read NOT_SENT. A synchronized Java method protects only one JVM and may still be insufficient across instances or independent paths.\n\nLevel 8 — Multiple servers: create a unique notification key such as orderId + notificationType, enforce uniqueness in the database, and atomically claim pending work using conditional updates or leases. Only the worker that successfully claims it processes the job.\n\nAdvanced production correction: 'INSERT ... ON CONFLICT DO NOTHING' stops concurrent duplicate claims but, if a worker crashes after claiming, a permanent row can strand the notification. Add retryable leases, recovery, and state transitions. A transactional outbox commits the order and event intent together; Kafka or a queue can deliver asynchronously. Exactly-once external email delivery generally cannot be guaranteed without downstream cooperation.\n\nInterview-ready close: Observer gives decoupling; production reliability needs durable event intent, isolation, retries, concurrency control, and explicit delivery semantics.\n\nLast-minute review: Subscribe → publish → isolate failures → retry → idempotency → atomic claim → outbox/recovery.\n\nJava + AI Engineering | Detailed Interview Handbook 7","image":""},{"title":"Java + AI Detailed Handbook","cat":"Java & AI","page":8,"heading":"TOPIC 7 OF 11","text":"TOPIC 7 OF 11\n\nLLM vs SLM vs LRM vs VLM: Model Selection\n\nLLM (large language model): General-purpose language generation and understanding; useful for open-ended support, drafting, and broad knowledge tasks. Cloud APIs are common, but not mandatory.\n\nSLM (small language model): Smaller and often cheaper/faster for narrow workloads; some can run locally. Fine-tuning can improve task-specific performance, but matching a large model is not guaranteed.\n\nLRM (reasoning model): Optimized for multi-step reasoning, coding, math, and planning; may use more computation and latency. 'Thinking' is not proof of correctness.\n\nVLM (vision-language model): Accepts images with text, useful for invoices, screenshots, scanned forms, and charts. Visual inputs may be encoded as image patches/tokens depending on architecture.\n\nScenario: An e-commerce platform routes invoice images to a VLM, straightforward high-volume intent classification to a tested SLM, complex refund-policy reasoning to a reasoning-capable model, and general chat to a suitable LLM.\n\nInterviewer follow-up: How would you implement routing in Spring Boot? Use a request classifier based on modality, risk, complexity, and privacy; call an approved model through an adapter; measure confidence or validation results; escalate when quality thresholds are not met.\n\nInterviewer follow-up: What about privacy? A local SLM may reduce external transfer, but access controls, logging policy, and model hosting still matter.\n\nInterviewer follow-up: How do you optimize cost? Start with the least expensive model that meets measured quality, latency, and compliance requirements; use fallbacks and track cost per successful outcome.\n\nLast-minute review: Choose by modality, complexity, quality, privacy, latency, and cost. Categories overlap.\n\nJava + AI Engineering | Detailed Interview Handbook 8","image":""},{"title":"Java + AI Detailed Handbook","cat":"Java & AI","page":9,"heading":"TOPIC 8 OF 11","text":"TOPIC 8 OF 11\n\nDocker vs Kubernetes: Packaging and Orchestration\n\nDocker solves the 'works on my machine' problem by helping build and run containers with an application and its runtime dependencies. A container image packages the app, but host kernel, architecture, configuration, and external services can still affect behavior.\n\nThink of Docker as packaging the shopping application into a portable lunchbox. A Dockerfile defines build steps; the resulting image is immutable, and a running container is an instance of that image.\n\nKubernetes solves a different problem: operating many containerized workloads across machines. It schedules Pods, maintains desired replicas, exposes Services, manages rollouts, and helps recover from failures.\n\nScenario: A Spring Boot shopping service is containerized. During a sale, a Kubernetes Deployment runs multiple Pods and a Service provides stable discovery. A Horizontal Pod Autoscaler can add replicas when configured metrics and resource capacity support it.\n\nFollow-up: A Pod crashes. A Deployment controller can replace failed Pods; kubelet may restart failed containers according to policy. Readiness probes prevent routing traffic to an unready Pod; liveness probes detect certain stuck states.\n\nFollow-up: A deployment causes errors. Rolling updates and rollback can limit impact, but probes, surge/unavailable settings, and observability must be configured properly.\n\nFollow-up: What if a Pod is CrashLoopBackOff? Inspect previous logs, events, image/config/secrets, memory limits, and startup probes before blindly restarting.\n\nTechnical nuance: Kubernetes does not require the Docker Engine runtime. It commonly uses containerd or another CRI-compatible runtime, while Docker remains useful for building images.\n\nLast-minute review: Docker builds/runs containers; Kubernetes schedules, scales, networks, and heals workloads.\n\nJava + AI Engineering | Detailed Interview Handbook 9","image":""},{"title":"Java + AI Detailed Handbook","cat":"Java & AI","page":10,"heading":"TOPIC 9 OF 11","text":"TOPIC 9 OF 11\n\nLatency vs Throughput vs Bandwidth\n\nLatency is elapsed time for an operation, commonly measured from request start until response. Example: a Spring Boot API responds in 200 milliseconds. Lower latency usually improves responsiveness.\n\nThroughput is successfully completed work per time interval. Example: 5,000 requests per second. Throughput can rise with concurrency until a bottleneck saturates.\n\nBandwidth is a network link's data-carrying capacity. Example: 1 gigabit per second. Available bandwidth does not guarantee the application can process requests at that rate.\n\nScenario 1: API latency jumps from 200 milliseconds to 5 seconds. Compare P50/P95/P99 latency, traces, DB query time, connection pool wait, downstream calls, CPU, GC, and thread pool saturation. Locate the changed span before optimizing.\n\nScenario 2: Throughput stays high while latency rises. Queueing may be increasing near saturation; requests can complete per second while each waits longer. Little's Law links average concurrency, throughput, and response time in stable systems.\n\nScenario 3: Upgrading bandwidth does not improve API response. The bottleneck might be DB locks, CPU, serialization, connection pools, or a slow payment provider rather than the network.\n\nScenario 4: Improve throughput without unacceptable latency using efficient queries, caching, bounded concurrency, async I/O where suitable, batching, and horizontal scaling. Validate with representative load tests.\n\nMonitor with Micrometer, Spring Boot Actuator, distributed tracing, JVM and pool metrics, and network telemetry. Use service-level objectives rather than averages alone.\n\nLast-minute review: Latency = how long; throughput = how much completed work per second; bandwidth = maximum network data capacity per second.\n\nJava + AI Engineering | Detailed Interview Handbook 10","image":""},{"title":"Java + AI Detailed Handbook","cat":"Java & AI","page":11,"heading":"TOPIC 10 OF 11","text":"TOPIC 10 OF 11\n\nLoad Balancer: Algorithms, Health Checks and High Availability\n\nA load balancer distributes incoming requests among multiple healthy backend servers. If one shopping server can process roughly 1,000 requests per second, four comparable servers offer a nominal 4,000 requests per second before shared bottlenecks and overhead.\n\nUsers send requests to one frontend address. The load balancer selects a backend, forwards the request, and may terminate TLS, enforce limits, or attach routing headers depending on the architecture.\n\nRound robin sends consecutive requests to A, B, C, D, then A again. It is simple when server capacity and request costs are similar, but ignores current load.\n\nLeast connections favors the backend with fewer active connections. If A has 40 and B has 5, B may be chosen. Connection count is only a proxy for work; HTTP multiplexing, long-lived connections, and unequal request costs complicate the picture.\n\nHealth checks periodically test backends. If D repeatedly fails, the balancer removes it from routing until it recovers. Multiple failures before ejection reduce sensitivity to transient network glitches.\n\nIn the example, A, B, and C still have a nominal 3,000 requests per second capacity against 2,000 incoming requests per second, assuming the load is evenly spread and shared dependencies remain healthy.\n\nBut the balancer can be a single point of failure. An active-passive pair may share a virtual IP using failover mechanisms; a standby takes over if the active instance fails. Cloud architectures may instead use managed, multi-zone load balancers or DNS/anycast approaches.\n\nFollow-up: What about sticky sessions? Prefer stateless application instances with shared session state where needed; affinity can reduce flexibility and create skew.\n\nFollow-up: What about failed health checks? Distinguish liveness from readiness, set realistic thresholds, and avoid routing to a server that can answer a trivial ping but cannot serve business traffic.\n\nLast-minute review: Identify healthy backends, then choose one using a routing algorithm; remove unhealthy instances and protect the load-balancer layer itself.\n\nJava + AI Engineering | Detailed Interview Handbook 11","image":""},{"title":"Java + AI Detailed Handbook","cat":"Java & AI","page":12,"heading":"TOPIC 11 OF 11","text":"TOPIC 11 OF 11\n\nCircuit Breaker: Cascading Failure and Resilience4j\n\nInterview question: Service A calls a slow payment API (Service B) during heavy traffic. How do you stop B from taking A down too?\n\nWithout protection, each synchronous call waits on a slow downstream response, occupying a request thread or concurrency slot. As calls accumulate, queues and connection pools fill. Latency rises; retries add extra traffic and can amplify the overload. Eventually A may become unavailable even though its own code is healthy: a cascading failure.\n\nA circuit breaker tracks call outcomes and, when configured thresholds are met, stops attempting most calls for a recovery period. Think of a fuse that opens to protect the caller and give the dependency room to recover.\n\nCLOSED: calls are permitted and outcomes are recorded. OPEN: calls are rejected quickly, usually through a fallback or explicit service-unavailable response. HALF_OPEN: a limited number of probe calls test whether the dependency has recovered.\n\nExample: Resilience4j may be configured with a 50 percent failure-rate threshold, a minimum number of recorded calls, a sliding window, an open-state wait, and a limited number of half-open calls. The breaker does not necessarily open after one failure or before the minimum sample size is reached.\n\nIf probe calls fail, the breaker reopens. If enough probes succeed according to configured thresholds, it closes. Monitor state transitions, rejected calls, failure rates, and user impact.\n\nCircuit breaker alone is insufficient. Set strict connect/read/overall timeouts; use bulkheads to cap concurrent payment calls; use bounded retries with exponential backoff and jitter only for transient, safe-to-retry operations; apply rate limiting and queue controls where appropriate.\n\nPayment-specific trap: Retrying a charge can double-charge the customer. Use a stable idempotency key with a provider that supports idempotent payment requests, persist payment intent/state, and reconcile uncertain outcomes rather than blindly retrying.\n\nFallback must respect business correctness. For product recommendations, cached results may be acceptable; for a payment authorization, do not claim success if the payment status is unknown. Return a pending/failed state and reconcile asynchronously if required.\n\nIn Spring Boot, Resilience4j can decorate the payment client with CircuitBreaker, TimeLimiter where supported, Retry, and Bulkhead. Ensure annotation/proxy behavior and exception classification are understood, and avoid retrying every circuit-open rejection.\n\nInterviewer follow-up: Why can retries make it worse? Each failed request may multiply downstream calls and increase load on an already failing service. Retries should have budgets, jitter, and idempotency.\n\nInterviewer follow-up: Why do threads still get exhausted with a circuit breaker? It reacts after observed failures/slow calls; unbounded concurrency and long timeouts can exhaust resources before opening. Bulkheads and timeouts are critical.\n\nJava + AI Engineering | Detailed Interview Handbook 12","image":""},{"title":"Java + AI Detailed Handbook","cat":"Java & AI","page":13,"heading":"Interviewer follow-up: What is the right threshold? No universal 50 percent setting. Choose window, minim","text":"Interviewer follow-up: What is the right threshold? No universal 50 percent setting. Choose window, minimum calls, slow-call thresholds, and open duration based on traffic, service SLOs, and load tests.\n\nInterview-ready answer: I would combine timeouts, bulkheads, a tuned circuit breaker, bounded retries for safe requests, and honest fallbacks. I would instrument downstream latency and breaker transitions, and protect payment correctness with idempotency and reconciliation.\n\nLast-minute review: Closed = allow; Open = fail fast; Half-open = probe. Circuit breaker protects availability, not payment correctness by itself.\n\nJava + AI Engineering | Detailed Interview Handbook 13","image":""},{"title":"Java + AI Expanded Handbook","cat":"Java & AI","page":1,"heading":"Expanded 11-Topic Interview Handbook","text":"Senior Java + AI Engineering\n\nExpanded 11-Topic Interview Handbook\n\nInterview-ready explanations, real-world stories, follow-up questions, implementation guidance and quick revision. Designed for senior Java / Spring Boot technical interviews.\n\nHow to use: first explain the problem in plain language, then describe the design and trade-offs, then show how you would monitor and recover it in production.\n\n1. LLM Hallucinations\n\nA hallucination is a fluent but unsupported or incorrect model response. The model predicts plausible next tokens rather than querying a guaranteed fact database. A strong answer distinguishes missing knowledge, misleading context and model overconfidence.\n\nHow do you explain hallucinations?\n\nImagine a support chatbot confidently invents a refund exception. Its answer sounds credible, but the source policy never said it. I would treat the model output as untrusted until validated against authoritative data.\n\nHow do you reduce hallucinations?\n\nGround answers in retrieved approved documents, use clear instructions to cite evidence and abstain when evidence is missing, validate structured outputs, and evaluate with representative test sets. Lower temperature may improve consistency but does not guarantee factuality.\n\nProduction scenarios and follow-ups\n\nQ: The policy is missing from the knowledge base. What should happen?\n\nA: Return a transparent 'I cannot verify this from the available policy' response and offer escalation, not a fabricated rule.\n\nQ: RAG retrieves the right document but the answer is wrong. Where do you look?\n\nA: Inspect prompt construction, truncation, contradictory passages, model output and groundedness evaluation separately from retrieval relevance.\n\nLast-minute revision\n\nHallucination = unsupported generation. Grounding, abstention, verification and evals reduce risk; no single setting eliminates it.\n\n2. API Rate Limiting\n\nRate limiting protects backend capacity and controls abuse. It decides how many requests a client, API key, tenant or endpoint may make within a defined policy.\n\nHow does token bucket work?\n\nA bucket has capacity C and refills at rate R tokens per second. Each accepted request consumes a token. Bursts are allowed up to capacity; once empty, requests are rejected or delayed. This balances short spikes with a stable","image":""},{"title":"Java + AI Expanded Handbook","cat":"Java & AI","page":2,"heading":"average rate.","text":"average rate.\n\nHow would you implement distributed rate limiting?\n\nIn Spring Boot, identify a trustworthy principal at the gateway, then use an atomic Redis script or managed gateway limiter to update bucket state across replicas. Set expiration, handle clock assumptions and choose fail-open versus fail-closed based on business risk.\n\nWhat do you return when limited?\n\nHTTP 429 Too Many Requests, ideally with Retry-After and clear client guidance. For authentication abuse, combine rate limits with account protections, monitoring and security controls.\n\nProduction scenarios and follow-ups\n\nQ: One user rotates IP addresses. What changes?\n\nA: Rate limit on authenticated account, API key and other appropriate signals, not IP alone.\n\nQ: Redis becomes unavailable. What now?\n\nA: Choose a documented fallback: local conservative limits, fail-closed for sensitive endpoints, or controlled fail-open for low-risk traffic.\n\nLast-minute revision\n\nToken bucket supports bursts; Redis atomic operations support multi-instance enforcement; 429 communicates rejection.\n\n3. RAG: Internal Working and Production Scenarios\n\nRetrieval-Augmented Generation combines external knowledge retrieval with generation. Example: a shopper asks whether a phone can be returned after 10 days; the authoritative policy allows only 7 days.\n\nPhase 1: How is the knowledge indexed?\n\nLoad approved policy documents, parse and clean text, split into coherent chunks with overlap where useful, attach metadata such as document ID, tenant, policy version and effective date, generate embeddings and store vectors plus source text in a searchable index.\n\nPhase 2: What happens when the user asks a question?\n\nEmbed the query with a compatible embedding model, apply access and metadata filters, retrieve candidate chunks using vector similarity and possibly keyword search, rerank relevant results, and assemble a prompt containing the question plus source passages. The model answers that a 10-day return is outside the 7-day policy, with citation.\n\nHow do you update a policy from 7 to 14 days?\n\nVersion the documents, re-index changed chunks, atomically switch the active version or filter by effective date, remove stale records, invalidate caches and test that current queries retrieve the 14-day policy.\n\nWhere does Spring Boot fit?\n\nExpose a secured chat endpoint; orchestrate retrieval, filtering, prompt assembly and model calls; log trace IDs, retrieval IDs, latency and token usage. Keep access checks deterministic rather than trusting the model.\n\nProduction scenarios and follow-ups\n\nQ: Correct policy exists but wrong chunks are retrieved. What do you change?","image":""},{"title":"Java + AI Expanded Handbook","cat":"Java & AI","page":3,"heading":"A: Inspect parsing, chunk boundaries, embedding model, query rewriting, hybrid retrieval, metadata filter","text":"A: Inspect parsing, chunk boundaries, embedding model, query rewriting, hybrid retrieval, metadata filtering, top-k and reranking; measure recall@k before blaming generation.\n\nQ: A customer sees another tenant's documents. How do you prevent it?\n\nA: Enforce authorization and tenant filters in the retrieval query and document store, and test cross-tenant access; prompt instructions alone are insufficient.\n\nQ: Millions of documents cause high latency. What do you optimize?\n\nA: Measure embedding, search, reranking and generation separately; tune index structure, metadata prefilters, caching, top-k, context size and model choice.\n\nQ: RAG or fine-tuning?\n\nA: RAG is preferable for frequently changing factual knowledge and source attribution. Fine-tuning is useful for behavior, formatting or specialized patterns; they can be combined.\n\nLast-minute revision\n\nIndexing: documents → chunks → embeddings → index. Query: embed → retrieve → rerank → ground → generate. RAG reduces but does not eliminate hallucinations.\n\n4. Subword Tokenization\n\nTokenization converts text into units represented by token IDs. Word tokenization creates huge vocabularies and unknown-word issues; character tokenization creates long sequences; subword tokenization balances both.\n\nWhy use subwords?\n\nCommon words may be single tokens while rare words are broken into reusable fragments. This bounds vocabulary size and handles unfamiliar words using smaller pieces. Common algorithms include BPE and Unigram.\n\nWhat are the disadvantages?\n\nExact character positions can be obscured inside tokens, so letter counting is unreliable without explicit character processing. Token efficiency also varies by language and script; underrepresented languages can require more tokens for the same meaning.\n\nProduction scenarios and follow-ups\n\nQ: Why can a model struggle to count letters in strawberry?\n\nA: It reasons over tokens, not necessarily individual characters. For exact counts, use deterministic string operations.\n\nQ: Why does Hindi text sometimes cost more tokens?\n\nA: Token segmentation and vocabulary training distribution can produce more fragments; check the specific tokenizer rather than assuming a fixed ratio.\n\nLast-minute revision\n\nSubwords balance vocabulary size and sequence length. Token boundaries are not word or character boundaries.\n\n5. AI Engineering Definitions: 19 Fast Concepts\n\nThese are short, interview-friendly definitions with a practical use case for each.\n\nLLM","image":""},{"title":"Java + AI Expanded Handbook","cat":"Java & AI","page":4,"heading":"A large language model predicts tokens from context; use it for drafting and conversational reasoning, wh","text":"A large language model predicts tokens from context; use it for drafting and conversational reasoning, while validating business-critical outputs.\n\nTokens\n\nUnits of text processed by a tokenizer; token counts affect context limits, latency and billing.\n\nContext window\n\nMaximum tokens available to a model for input and sometimes output combined; use retrieval and summarization to manage it.\n\nPrompt\n\nInstructions and content supplied for a model task; define task, constraints and expected format.\n\nSystem prompt\n\nHigher-priority application instructions governing assistant behavior; never rely on them as the sole security boundary.\n\nHallucination\n\nUnsupported or incorrect generated content; mitigate with evidence, abstention and checks.\n\nTemperature\n\nA sampling control affecting output randomness; lower settings are often more consistent, not automatically factual.\n\nRAG\n\nRetrieves external evidence and provides it to the model; see Topic 3 for the complete pipeline.\n\nEmbeddings\n\nNumerical vectors representing semantic features; support similarity search.\n\nVector database\n\nIndex and storage optimized for vector nearest-neighbor queries with useful metadata filters.\n\nFine-tuning\n\nFurther training a model on task-specific examples to influence behavior or performance; it is not a live document update mechanism.\n\nAgent\n\nA system that uses a model to choose actions and tools toward a goal, under explicit controls.\n\nWorkflow\n\nA defined sequence or graph of processing steps; deterministic workflows are easier to test for predictable tasks.\n\nTool calling\n\nA model requests a structured function invocation; application code authorizes, executes and validates the action.\n\nMCP","image":""},{"title":"Java + AI Expanded Handbook","cat":"Java & AI","page":5,"heading":"Model Context Protocol standardizes exposure of tools and resources to AI clients; authentication and aut","text":"Model Context Protocol standardizes exposure of tools and resources to AI clients; authentication and authorization still matter.\n\nEvals\n\nRepeatable tests of quality, safety and reliability; include golden cases and regression datasets.\n\nHuman in the loop\n\nA person reviews or approves consequential actions such as refunds or sensitive changes.\n\nGuardrails\n\nInput, action and output controls that constrain risk; use code-level permissions as well as model checks.\n\nLatency and inference cost\n\nLatency measures time to respond; inference cost includes token processing and infrastructure, so optimize model choice and context size.\n\nProduction scenarios and follow-ups\n\nQ: How do these fit in an order-support chatbot?\n\nA: A workflow retrieves policy via RAG, an LLM drafts an answer, guardrails verify scope, evals measure correctness and a human approves exceptional refunds.\n\nLast-minute revision\n\nKnow each term in one sentence, one example and one limitation. Detailed RAG content remains in Topic 3.\n\n6. Observer Pattern: Eight Interview Levels\n\nOrder placement triggers email, SMS and analytics updates. The Observer pattern decouples the publisher from multiple subscribers, but production reliability needs more than an in-memory callback loop.\n\nLevel 1: What is the pattern?\n\nAn order event is published; independent observers subscribe and react, so the order service need not know every downstream behavior.\n\nLevel 2: Why not direct calls?\n\nAdding new consumers otherwise requires editing the order service. Observer improves extensibility, although it does not automatically provide durable delivery.\n\nLevel 3: How implement it?\n\nDefine OrderObserver.onOrderPlaced(event), register implementations and dispatch after the order is committed. Spring application events are convenient in-process but not a durable broker.\n\nLevel 4: One observer fails?\n\nIsolate exceptions per observer, but consider whether synchronous callbacks still delay the request.\n\nLevel 5: How do you retry?\n\nPersist notification jobs and statuses; use bounded retries, backoff, dead-letter handling and monitoring.","image":""},{"title":"Java + AI Expanded Handbook","cat":"Java & AI","page":6,"heading":"Level 6: What about duplicate emails?","text":"Level 6: What about duplicate emails?\n\nUse idempotency keys and provider support where available. A crash after external send but before status update can still cause duplicates.\n\nLevel 7: What about simultaneous requests?\n\nAn in-process synchronized block only protects one JVM; use a database uniqueness constraint or atomic claim.\n\nLevel 8: What about multiple servers?\n\nUse a unique notification key and atomic claim with lease/recovery. A successful claim prevents simultaneous sends but cannot alone guarantee exactly-once external delivery.\n\nProduction scenarios and follow-ups\n\nQ: Order commits but event publishing fails. How do you fix it?\n\nA: Use a transactional outbox written in the same database transaction as the order, then publish asynchronously to Kafka or a worker.\n\nQ: Worker crashes after claiming the row. What now?\n\nA: Use claim expiry, heartbeat or recovery sweeps so jobs do not remain permanently stuck.\n\nLast-minute revision\n\nObserver = decoupled subscribers; durable outbox + idempotent consumers + retries = stronger production design.\n\n7. LLM vs SLM vs LRM vs VLM\n\nThese are overlapping model categories, not mutually exclusive product families. Select based on task, input modality, latency, privacy, quality and cost.\n\nWhen use an LLM?\n\nUse a capable general-purpose language model for open-ended support, synthesis and drafting when broad competence matters.\n\nWhen use an SLM?\n\nUse a smaller language model for narrow, high-volume classification, extraction or local deployment when evaluation shows sufficient accuracy.\n\nWhen use an LRM?\n\nUse a reasoning-oriented model for complex planning, coding or multistep analysis where extra compute is justified.\n\nWhen use a VLM?\n\nUse a vision-language model when the input includes images, charts or screenshots; evaluate OCR and layout fidelity carefully.\n\nHow route requests?\n\nBuild a deterministic classifier for modality and risk, select a default cost-efficient model, then escalate based on uncertainty, task difficulty or validation failure. Log quality, latency and spend by route.\n\nProduction scenarios and follow-ups","image":""},{"title":"Java + AI Expanded Handbook","cat":"Java & AI","page":7,"heading":"Q: A scanned invoice arrives. What happens?","text":"Q: A scanned invoice arrives. What happens?\n\nA: Route to a vision-capable model or document pipeline, validate extracted amounts and identifiers with schema and business rules.\n\nQ: Can fine-tuning an SLM replace an LLM?\n\nA: Sometimes for narrow tasks, but only if representative offline and live evaluations confirm the quality target.\n\nLast-minute revision\n\nRoute by task and measured quality, not model size alone.\n\n8. Docker vs Kubernetes\n\nDocker commonly builds and runs containers; Kubernetes schedules and orchestrates containerized workloads across nodes. Kubernetes can use containerd and does not require Docker as its runtime.\n\nHow does Docker help?\n\nA Dockerfile defines the runtime image for a Spring Boot JAR, its base runtime, non-root user and startup command. The resulting OCI image is portable across compatible environments.\n\nWhat does Kubernetes add?\n\nDeployments manage desired replicas, Pods host containers, Services provide stable discovery, and ingress or gateways expose traffic. Kubernetes reschedules failed Pods and supports rolling deployments.\n\nWhat happens during a sale?\n\nMetrics drive a Horizontal Pod Autoscaler to request more replicas. Actual scaling depends on cluster capacity, resource requests and readiness; adding Pods does not solve a database bottleneck.\n\nProduction scenarios and follow-ups\n\nQ: Pod is CrashLoopBackOff. What do you inspect?\n\nA: Use kubectl describe pod and kubectl logs --previous; inspect application startup, secrets, probes, OOM kills and dependency failures.\n\nQ: Traffic reaches unready instances. How do you prevent it?\n\nA: Configure readiness probes; use liveness for stuck processes and startup probes for slow boot.\n\nLast-minute revision\n\nDocker packages images; Kubernetes orchestrates workloads. Monitor readiness, scaling and dependencies.\n\n9. Latency vs Throughput vs Bandwidth\n\nLatency is response time per operation; throughput is completed work per second; bandwidth is maximum data transfer capacity of a network path.\n\nExplain with numbers.\n\nAn API may have 200 ms latency and complete 5,000 requests per second, while a network link offers 1 Gbps. These describe different dimensions and cannot be substituted.\n\nWhy does latency rise under load?","image":""},{"title":"Java + AI Expanded Handbook","cat":"Java & AI","page":8,"heading":"Queueing increases when offered work approaches a bottleneck's capacity. Threads, CPU, DB connections and","text":"Queueing increases when offered work approaches a bottleneck's capacity. Threads, CPU, DB connections and downstream limits can saturate even when network bandwidth is unused.\n\nHow measure?\n\nTrack p50, p95 and p99 response time, successful RPS, errors, in-flight requests, CPU, connection pools and network usage. Use distributed tracing and load tests.\n\nProduction scenarios and follow-ups\n\nQ: API grows from 200 ms to 5 s. First checks?\n\nA: Compare traces, dependency timings, slow queries, thread pool and GC behavior against a known-good baseline.\n\nQ: Why didn't 10 Gbps networking help?\n\nA: The bottleneck may be the database, CPU, locks, external API or application concurrency, not the network.\n\nLast-minute revision\n\nLatency = time per request; throughput = completed requests per second; bandwidth = network capacity.\n\n10. Load Balancers: From One Server to High Availability\n\nA single shopping server handles 1,000 RPS, but
